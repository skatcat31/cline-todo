name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, format check, unit tests (with coverage gate) and the production
  # build. The built app is published as an artifact for the deploy job.
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Build for production
        run: npm run build

      - name: Upload built app
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  # End-to-end tests (Playwright) against a production build, covering the
  # core user flows and the PWA service worker / offline behavior.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Reuse the Chromium binary between runs (the system dependencies are
      # still installed by --with-deps; only the browser download is cached).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npx playwright test

  # Publish the built app to GitHub Pages (main branch only). The gh-pages
  # branch is the Pages source for this repository. Deployment is gated on
  # the e2e job as well, so a broken user flow never reaches the live site.
  deploy:
    runs-on: ubuntu-latest
    needs: [ci, e2e]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download built app
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      # Announce where the site was deployed. Uses the default *.github.io
      # domain; update this if a custom domain is ever configured.
      - name: Show deployed site URL
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          if [ "$owner" = "$repo" ]; then
            echo "Site is live at https://$owner.github.io/"
          else
            echo "Site is live at https://$owner.github.io/$repo/"
          fi
