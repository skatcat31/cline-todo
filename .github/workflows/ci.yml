name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, format check, unit tests (with coverage gate), the production
  # build and the bundle size check. The built app (root base path) is
  # published as an artifact that the e2e job serves and tests; the
  # deploy job rebuilds with the GitHub Pages base path.
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Security: fail on a known high- or critical-severity advisory in a
      # direct or transitive dependency. Dependabot's weekly update PRs
      # usually keep the tree clean; this is the safety net for a lapse.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Run tests with coverage
        run: npm test -- --coverage

      # Publish the HTML coverage report (written to coverage/ by the test
      # step, see coverage.reporter in vite.config.js) so per-file coverage
      # can be browsed without digging through the log.
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage

      # Build for the root base path: the e2e job serves this artifact with
      # `vite preview --base=/`, so the two must agree. On the runner
      # GITHUB_REPOSITORY is set and would otherwise drive the GitHub
      # Pages sub‑path base in vite.config.js.
      - name: Build for production
        run: npm run build -- --base=/

      # The main bundle is dominated by MUI, so Vite's default 500 kB
      # chunk warning fires on every build; the real guardrail is this
      # explicit budget (scripts/check-bundle-size.mjs), which is set to
      # the same value as build.chunkSizeWarningLimit in vite.config.js.
      - name: Check bundle size
        run: npm run size

      # The e2e job consumes this artifact.
      - name: Upload built app
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  # End-to-end tests (Playwright) against the production build the ci job
  # published – covering the core user flows and the PWA service worker /
  # offline behavior without building the app a second time.
  e2e:
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download built app
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # Reuse the browser binaries between runs (the system dependencies are
      # still installed by --with-deps; only the browser download is cached).
      # All three browsers: the specs run on chromium, firefox and webkit
      # (see the projects in playwright.config.js).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run end-to-end tests
        run: npx playwright test

  # Publish the built app to GitHub Pages (main branch only), via the
  # official Pages actions (the Pages source in Settings → Pages must be
  # "GitHub Actions", not a branch). The deploy job rebuilds from source
  # (rather than reusing the ci job's artifact) because GitHub Pages needs
  # the repository sub‑path base, while the ci job builds with the root
  # base for the e2e job. Deployment is gated on the e2e job as well, so
  # a broken user flow never reaches the live site.
  deploy:
    runs-on: ubuntu-latest
    needs: [ci, e2e]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Enables the Pages environment for the runner (sets the Pages
      # origin and other deploy‑pages inputs).
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # GITHUB_REPOSITORY is set on the runner, so this builds with the
      # GitHub Pages sub‑path base (see vite.config.js).
      - name: Build for production
        run: npm run build

      # Hands the build output to the Pages deployer (instead of pushing a
      # gh‑pages branch, which the previous peaceiris action did).
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Announce where the site was deployed. Uses the default *.github.io
      # domain; update this if a custom domain is ever configured.
      - name: Show deployed site URL
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          if [ "$owner" = "$repo" ]; then
            echo "Site is live at https://$owner.github.io/"
          else
            echo "Site is live at https://$owner.github.io/$repo/"
          fi
