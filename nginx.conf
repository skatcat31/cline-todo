# Nginx configuration for the runtime image. The official image runs its
# master process as root; here the whole process runs as the unprivileged
# "nginx" user (shipped with the image), so:
#  - there is no "user" directive (only meaningful for a root master),
#  - logs go to stdout/stderr (no root-owned log files to write),
#  - the pid file lives in /tmp (writable by the nginx user),
#  - the server listens on 8080 (unprivileged port).
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # Compress text-based assets (the JS/CSS bundles are the bulk of the
  # payload); already-compressed types (woff2, png) are left alone.
  gzip on;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    image/svg+xml
    application/manifest+json;

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall back to index.html so the
    # client-side router can take over (same as `vite preview`).
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}